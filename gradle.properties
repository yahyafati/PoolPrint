#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Pool Print version: the single source for both apps (docs/release.md, Phase 2; D-23).
#versionName is SemVer (MAJOR >= 1), release candidates as -rc.N; the macOS package drops the -rc.N suffix.
#versionCode is Android's counter: +1 for every build that leaves your Mac, never lower or equal.
poolprint.versionName=1.0.0-rc.1
poolprint.versionCode=2
